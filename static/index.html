<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caddy</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<input type="file" id="file-input" accept=".mp4,.mov,.mkv,.avi">
<canvas id="thumb-canvas" style="display:none;"></canvas>

<!-- S1: Select -->
<div id="screen-select" class="screen active">
  <div id="drop-card">
    <div id="drop-card-text">Drop a video here</div>
    <div id="drop-or">or</div>
    <button id="btn-select-file">
      Select <i class="fa-solid fa-upload"></i>
    </button>
    <div id="drop-card-subtitle">MP4 FILES ONLY</div>
  </div>
</div>

<!-- S2: Frames -->
<div id="screen-frames" class="screen">
  <div id="frames-main">
    <div id="frames-meta">
      <div class="meta-group">
        <span class="meta-label">Filename</span>
        <span class="meta-value" id="meta-filename"></span>
      </div>
      <div class="meta-group">
        <span class="meta-label">Length</span>
        <span class="meta-value" id="meta-length"></span>
      </div>
    </div>
    <div id="frames-video-wrap">
      <video id="frames-video" preload="metadata"></video>
      <div id="video-tc-overlay">00:00:00</div>
    </div>
    <div id="frames-controls">
      <div id="playback-btns">
        <button class="ctrl-step" id="btn-step-back" title="Step back"><i class="fa-solid fa-backward-step"></i></button>
        <button id="btn-play-main">
          <i class="fa-solid fa-play"  id="icon-play"></i>
          <i class="fa-solid fa-pause" id="icon-pause" style="display:none"></i>
        </button>
        <button class="ctrl-step" id="btn-step-fwd" title="Step forward"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div id="waveform-wrap">
        <div id="waveform-bars"></div>
        <div id="playhead"></div>
      </div>
      <div id="vol-wrap">
        <button id="vol-btn">
          <i class="fa-solid fa-volume-high" id="icon-vol-on"></i>
          <i class="fa-solid fa-volume-xmark" id="icon-vol-off" style="display:none"></i>
        </button>
      </div>
    </div>
    <div id="frames-action">
      <button id="btn-add-remove" class="action-pill add">
        <span id="add-remove-icon">+</span>
        <span id="add-remove-text">Add frame</span>
      </button>
    </div>
  </div>
  <div id="frames-sidebar">
    <div id="thumb-list"></div>
    <div id="sidebar-fade"></div>
    <div id="frames-sidebar-bottom">
      <button id="btn-next" disabled>Next</button>
    </div>
  </div>
</div>

<!-- S3: Processing -->
<div id="screen-processing" class="screen">
  <div id="processing-card" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="processing-title">
    <svg id="processing-stroke" aria-hidden="true"><path id="stroke-r" pathLength="100"/><path id="stroke-l" pathLength="100"/></svg>
    <div id="processing-title">Processing</div>
    <div id="processing-label" role="status">Starting…</div>
    <button id="processing-cancel">Cancel</button>
  </div>
</div>

<!-- S4: Edit -->
<div id="screen-edit" class="screen">
  <div id="edit-bar">
    <div id="edit-summary">
      <span id="edit-count"></span>
      <span id="edit-checked"></span>
    </div>
    <div id="edit-bar-actions">
      <button class="bar-btn ghost" id="btn-back-frames">↩ Re-select frames</button>
      <button class="bar-btn" id="btn-export-docx">Export DOCX</button>
      <button class="bar-btn primary" id="btn-export-pdf">Export PDF</button>
    </div>
  </div>
  <div id="edit-main">
    <table id="storyboard">
      <thead>
        <tr><th></th><th>Frame</th><th>TC</th><th>VO</th><th>Super</th><th>Jingle</th><th>Graphics</th><th>Notes</th></tr>
      </thead>
      <tbody id="storyboard-body"></tbody>
    </table>
  </div>
</div>

<div id="save-indicator">Saved</div>

<script>
const App = {
  state: {
    sessionId: null,
    metadata:  null,
    filename:  '',
    timecodes: [],   // [{time, thumb}]
    rows:      [],
  },

  _wvN:    0,
  _wvDur:  0,
  _thresh: 0.12,

  // ── Utilities ──────────────────────────────────────────────────
  formatTC(s) {
    s = Math.floor(s);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  },

  formatOverlayTC(t) {
    const fps = this.state.metadata?.fps || 25;
    const totalFrames = Math.floor(t * fps);
    const ff = totalFrames % Math.round(fps);
    const totalSecs = Math.floor(totalFrames / Math.round(fps));
    const ss = totalSecs % 60;
    const mm = Math.floor(totalSecs / 60);
    return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}:${String(ff).padStart(2,'0')}`;
  },

  _esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  },

  show(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
  },

  // ── API ────────────────────────────────────────────────────────
  api: {
    async upload(file) {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      if (!r.ok) { let m = 'Upload failed'; try { m = (await r.json()).detail || m; } catch {} throw new Error(m); }
      return r.json();
    },
    async pollAutoFrames(sessionId) {
      for (let i = 0; i < 120; i++) {
        const r = await fetch(`/api/auto-frames/${sessionId}`);
        const data = await r.json();
        if (data.ready) return data.frames;
        await new Promise(res => setTimeout(res, 500));
      }
      return [];
    },
    async process(sessionId, timecodes, options) {
      const r = await fetch('/api/process', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, timecodes, options }),
      });
      if (!r.ok) throw new Error((await r.json()).detail || 'Process failed');
      return r.json();
    },
    connectSSE(sessionId, onMsg) {
      const es = new EventSource(`/api/progress/${sessionId}`);
      es.onmessage = e => {
        const msg = JSON.parse(e.data);
        if (!msg.ping) onMsg(msg);
        if (msg.step === 'complete' || msg.step === 'error') es.close();
      };
      return es;
    },
    async saveRows(sessionId, rows) {
      await fetch(`/api/rows/${sessionId}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows }),
      });
    },
    exportDocx(id) { window.location.href = `/api/export/docx/${id}`; },
    exportPdf(id)  { window.location.href = `/api/export/pdf/${id}`; },
  },

  // ── Screen 1: Select ──────────────────────────────────────────
  _initSelect() {
    const card = document.getElementById('drop-card');
    const fi   = document.getElementById('file-input');
    const btn  = document.getElementById('btn-select-file');

    btn.addEventListener('click', e => { e.stopPropagation(); fi.click(); });
    card.addEventListener('click', () => fi.click());
    fi.addEventListener('change', e => e.target.files[0] && this._upload(e.target.files[0]));

    card.addEventListener('dragover',  e => { e.preventDefault(); card.classList.add('drag-over'); });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', e => {
      e.preventDefault(); card.classList.remove('drag-over');
      const f = e.dataTransfer.files[0]; if (f) this._upload(f);
    });
  },

  async _upload(file) {
    const txt = document.getElementById('drop-card-text');
    txt.textContent = 'Uploading…';
    try {
      const data = await this.api.upload(file);
      this.state.sessionId = data.session_id;
      this.state.metadata  = data.metadata;
      this.state.filename  = data.filename;
      this.state.timecodes = [];
      this._setupFrameScreen(data);
      this.show('frames');
      this.api.pollAutoFrames(data.session_id).then(frames => {
        if (frames.length && this.state.timecodes.length === 0) {
          this.state.timecodes = frames.map(f => ({ time: f.time, thumb: f.thumbnail_url }));
          this.state.timecodes.sort((a, b) => a.time - b.time);
          this._renderThumbList();
          this._updateWaveform(document.getElementById('frames-video').currentTime || 0);
          this._updateActionBtn(document.getElementById('frames-video').currentTime || 0);
          document.getElementById('btn-next').disabled = false;
        }
      });
    } catch(e) {
      txt.textContent = e.message;
      setTimeout(() => { txt.textContent = 'Drop a file here'; }, 3000);
    }
    document.getElementById('file-input').value = '';
  },

  // ── Screen 2: Frames ──────────────────────────────────────────
  _setupFrameScreen(data) {
    const video = document.getElementById('frames-video');
    video.src = `/video/${data.session_id}`;
    document.getElementById('meta-filename').textContent = data.filename;
    document.getElementById('meta-length').textContent   = this.formatTC(data.metadata.duration || 0);
    document.getElementById('btn-next').disabled = true;
    this._renderThumbList();
  },

  _buildWaveform() {
    const c = document.getElementById('waveform-bars');
    const pillW = 5, gap = 3;
    this._wvN = Math.max(10, Math.floor((c.offsetWidth + gap) / (pillW + gap)));
    c.innerHTML = '';
    for (let i = 0; i < this._wvN; i++) {
      const b = document.createElement('div');
      b.className = 'wv-bar';
      b.style.background = 'var(--muted)';
      c.appendChild(b);
    }
    this._updateWaveform(document.getElementById('frames-video').currentTime || 0);
  },

  _updateWaveform(t) {
    const c    = document.getElementById('waveform-bars');
    const bars = c.children;
    const dur  = this._wvDur || 1;
    const pct  = t / dur;
    const n    = bars.length;

    const ww = document.getElementById('waveform-wrap');
    const ph = document.getElementById('playhead');
    ph.style.left = (pct * ww.offsetWidth) + 'px';

    const atSelected = this._findTCIdx(t) >= 0;
    ph.style.background = atSelected ? 'var(--amber)' : 'var(--red)';

    const selBars = new Set(this.state.timecodes.map(tc => Math.min(n - 1, Math.floor(tc.time / dur * n))));
    for (let i = 0; i < n; i++) {
      const barPct = i / n;
      bars[i].style.background = selBars.has(i) ? 'var(--amber)' : barPct < pct ? '#fff' : 'var(--muted)';
    }
  },

  _findTCIdx(t) {
    return this.state.timecodes.findIndex(tc => Math.abs(tc.time - t) < this._thresh);
  },

  _updateActionBtn(t) {
    const isSel = this._findTCIdx(t) >= 0;
    const btn   = document.getElementById('btn-add-remove');
    document.getElementById('add-remove-icon').textContent = isSel ? '−' : '+';
    document.getElementById('add-remove-text').textContent = isSel ? 'Remove frame' : 'Add frame';
    btn.className = 'action-pill ' + (isSel ? 'remove' : 'add');
  },

  _captureFrame(video) {
    const c = document.getElementById('thumb-canvas');
    c.width  = video.videoWidth  || 320;
    c.height = video.videoHeight || 180;
    c.getContext('2d').drawImage(video, 0, 0);
    return c.toDataURL('image/jpeg', 0.75);
  },

  _updateSidebarFade() {
    const list = document.getElementById('thumb-list');
    const fade = document.getElementById('sidebar-fade');
    const hasMore = list.scrollTop + list.clientHeight < list.scrollHeight - 2;
    fade.classList.toggle('hidden', !hasMore);
  },

  _renderThumbList() {
    const list = document.getElementById('thumb-list');
    list.innerHTML = '';
    if (this.state.timecodes.length === 0) {
      list.innerHTML = '<span class="no-frames-msg">No frames selected yet.</span>';
      this._updateSidebarFade();
      return;
    }
    this.state.timecodes.forEach((tc, i) => {
      const item = document.createElement('div');
      item.className = 'thumb-item';
      const num = document.createElement('span');
      num.className = 'thumb-num';
      num.textContent = i + 1;
      const wrap = document.createElement('div');
      wrap.className = 'thumb-img-wrap';
      const img = document.createElement('img');
      img.src = tc.thumb; img.alt = 'Frame ' + (i+1);
      wrap.style.cursor = 'pointer';
      wrap.addEventListener('click', () => {
        const video = document.getElementById('frames-video');
        video.currentTime = tc.time;
      });
      wrap.appendChild(img); item.appendChild(num); item.appendChild(wrap);
      list.appendChild(item);
    });
    this._updateSidebarFade();
  },

  _highlightThumb(t) {
    document.querySelectorAll('#thumb-list .thumb-img-wrap').forEach((wrap, i) => {
      const tc = this.state.timecodes[i];
      wrap.classList.toggle('at-time', !!(tc && Math.abs(tc.time - t) < this._thresh));
    });
  },

  // ── Screen 3: Processing ──────────────────────────────────────
  async _startProcessing() {
    this.show('processing');
    const run = this._procRun = (this._procRun || 0) + 1;   // a newer run or a cancel invalidates this one
    document.getElementById('processing-card').classList.remove('error');
    this._layoutStroke();
    this._setProgress(2);
    document.getElementById('processing-label').textContent = 'Starting…';

    try {
      await this.api.process(this.state.sessionId, this.state.timecodes.map(tc => tc.time), {});
    } catch(e) {
      this._processingError(e.message);
      return;
    }
    if (run !== this._procRun) return;

    this._procEs = this.api.connectSSE(this.state.sessionId, msg => {
      if (run !== this._procRun) return;
      if (msg.step === 'complete') {
        this.state.rows = msg.rows;
        this.state.rows.forEach((row, i) => {
          row._localThumb = this.state.timecodes[i]?.thumb || '';
          if (row.thumbnail_path) {
            const fname = row.thumbnail_path.split('/').pop();
            row.thumbnail_url = `/thumbs/${this.state.sessionId}/${fname}`;
          }
        });
        this._initEditScreen();
        this.show('edit');
        this._autosizeAll();
      } else if (msg.step === 'error') {
        this._processingError(msg.error || 'Unknown');
      } else {
        this._setProgress(msg.progress || 0);
        document.getElementById('processing-label').textContent = msg.label || '…';
      }
    });
  },

  _processingError(message) {
    document.getElementById('processing-card').classList.add('error');
    document.getElementById('processing-label').textContent = 'Error: ' + message;
  },

  _cancelProcessing() {
    this._procRun = (this._procRun || 0) + 1;
    this._procEs?.close();
    this._procEs = null;
    this.show('frames');
  },

  // Progress is drawn as the card's own border: two strokes start at top-centre and
  // grow down each side, meeting at bottom-centre. pathLength=100 makes p a true percentage.
  _setProgress(p) {
    p = Math.max(0, Math.min(100, p));
    document.getElementById('stroke-r').style.strokeDasharray = `${p} 100`;
    document.getElementById('stroke-l').style.strokeDasharray = `${p} 100`;
    document.getElementById('processing-card').setAttribute('aria-valuenow', Math.round(p));
  },

  _layoutStroke() {
    const card = document.getElementById('processing-card');
    const w = card.offsetWidth, h = card.offsetHeight;
    if (!w || !h) return;
    const svg = document.getElementById('processing-stroke');
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    const r = 16, i = 1, cx = w / 2;           // card radius; half the 2px border, so the stroke sits on it
    const x1 = w - i, y1 = h - i;
    document.getElementById('stroke-r').setAttribute('d',
      `M${cx},${i} H${x1 - r} A${r},${r} 0 0 1 ${x1},${i + r} V${y1 - r} A${r},${r} 0 0 1 ${x1 - r},${y1} H${cx}`);
    document.getElementById('stroke-l').setAttribute('d',
      `M${cx},${i} H${i + r} A${r},${r} 0 0 0 ${i},${i + r} V${y1 - r} A${r},${r} 0 0 0 ${i + r},${y1} H${cx}`);
  },

  // ── Screen 4: Edit (script sheet) ─────────────────────────────
  _openIdx: null,   // row whose inspect drawer is open

  _initEditScreen() {
    this._openIdx = null;
    this._syncTimecodes();
    this._renderEdit();
  },

  // Keep the frame picker's list in step with the review rows.
  _syncTimecodes() {
    this.state.timecodes = this.state.rows.map(r => ({
      time:  r.timecode_seconds,
      thumb: r.thumbnail_url || r._localThumb || '',
    }));
  },

  _renderEdit() {
    const tbody = document.getElementById('storyboard-body');
    tbody.innerHTML = '';
    const sid = this.state.sessionId;

    this.state.rows.forEach((row, i) => {
      row.row_number = i + 1;
      const thumb  = row.thumbnail_url || row._localThumb || '';
      const supers = Array.isArray(row.supers) ? row.supers.join('\n') : (row.supers || '');
      const tcDisp = row.timecode_display || this.formatTC(row.timecode_seconds || 0);
      const open   = this._openIdx === i;
      const field  = (key, val, label) =>
        `<td><textarea rows="1" data-field="${key}" aria-label="${label}, frame ${i + 1}">${this._esc(val)}</textarea></td>`;

      const tr = document.createElement('tr');
      tr.className = 'sheet-row' + (open ? ' open' : '');
      tr.dataset.idx = i;
      tr.innerHTML = `
        <td class="td-num"><span class="status-dot${row.status === 'CHECKED' ? ' ok' : ''}"></span><span class="num">${i + 1}</span></td>
        <td class="td-thumb"><button class="thumb-btn" data-act="toggle" aria-expanded="${open}" aria-label="Inspect frame ${i + 1}">${
          thumb ? `<img src="${thumb}" alt="">` : '<div class="thumb-ph"></div>'}</button></td>
        <td class="td-tc" data-act="toggle">${tcDisp}</td>
        ${field('transcript', row.transcript || '', 'VO')}
        ${field('supers', supers, 'Super')}
        ${field('jingle', row.jingle || '', 'Jingle')}
        ${field('graphics', row.graphics || '', 'Graphics')}
        ${field('notes', row.notes || '', 'Notes')}`;
      tbody.appendChild(tr);

      if (open) tbody.appendChild(this._buildDrawer(i, sid));
    });

    this._updateSummary();
    this._autosizeAll();
    if (this._openIdx !== null) this._initDrawerVideo();
  },

  _segmentOf(i) {
    const rows  = this.state.rows;
    const start = rows[i].timecode_seconds || 0;
    const end   = i + 1 < rows.length ? rows[i + 1].timecode_seconds : (this.state.metadata?.duration || start);
    return { start, end };
  },

  _buildDrawer(i, sid) {
    const row = this.state.rows[i];
    const { start, end } = this._segmentOf(i);
    const tr = document.createElement('tr');
    tr.className = 'drawer-row';
    tr.innerHTML = `
      <td colspan="8"><div class="drawer">
        <video id="drawer-video" src="/video/${sid}" preload="auto" controls></video>
        <div class="drawer-side">
          <div class="drawer-seg">Frame ${i + 1} · ${this.formatTC(start)} – ${this.formatTC(end)}</div>
          <div class="drawer-btns">
            <button class="bar-btn" data-act="play">▶ Play segment</button>
            <button class="bar-btn" data-act="check">${row.status === 'CHECKED' ? 'Mark as unchecked' : 'Mark as checked'}</button>
            <button class="bar-btn" data-act="add" id="drawer-add">+ Add frame at ${this.formatTC(start)}</button>
            <button class="bar-btn danger" data-act="delete">Delete frame</button>
            <button class="bar-btn ghost" data-act="close">Close</button>
          </div>
          <div class="drawer-err" id="drawer-err" role="status"></div>
          <p class="drawer-hint">Scrub the video to a moment between the frames, then add a frame there. The new row starts empty.</p>
        </div>
      </div></td>`;
    return tr;
  },

  _initDrawerVideo() {
    const video = document.getElementById('drawer-video');
    if (!video) return;
    const i = this._openIdx;
    const { start, end } = this._segmentOf(i);
    const addBtn = document.getElementById('drawer-add');
    const seekStart = () => { video.currentTime = start; };
    if (video.readyState >= 1) seekStart(); else video.addEventListener('loadedmetadata', seekStart, { once: true });

    video.addEventListener('timeupdate', () => {
      if (!video.paused && end > start && video.currentTime >= end) { video.pause(); video.currentTime = start; }
      addBtn.textContent = '+ Add frame at ' + this.formatTC(video.currentTime);
    });
    video.addEventListener('seeked', () => {
      addBtn.textContent = '+ Add frame at ' + this.formatTC(video.currentTime);
    });
  },

  _updateSummary() {
    const rows = this.state.rows;
    const done = rows.filter(r => r.status === 'CHECKED').length;
    document.getElementById('edit-count').textContent = `${rows.length} frame${rows.length === 1 ? '' : 's'}`;
    document.getElementById('edit-checked').textContent = `${done} of ${rows.length} checked`;
  },

  _autosizeAll() {
    // field-sizing: content handles this in current Chrome/Safari; fall back for the rest.
    if (CSS.supports('field-sizing', 'content')) return;
    document.querySelectorAll('#storyboard textarea').forEach(el => {
      if (!el.scrollHeight) return;
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 2 + 'px';
    });
  },

  async _saveNow() {
    clearTimeout(this._saveTimer);
    await this.api.saveRows(this.state.sessionId, this.state.rows);
    const ind = document.getElementById('save-indicator');
    ind.classList.add('visible');
    setTimeout(() => ind.classList.remove('visible'), 1800);
  },

  _drawerError(msg) {
    const el = document.getElementById('drawer-err');
    if (el) el.textContent = msg;
  },

  _toggleDrawer(i) {
    this._openIdx = this._openIdx === i ? null : i;
    this._renderEdit();
    if (this._openIdx !== null) {
      document.querySelector('.drawer-row')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  },

  async _addFrame() {
    const video = document.getElementById('drawer-video');
    if (!video) return;
    const t = parseFloat(video.currentTime.toFixed(3));
    this._drawerError('');
    const r = await fetch(`/api/frame/${this.state.sessionId}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ time: t }),
    });
    if (!r.ok) {
      let m = 'Could not add the frame.';
      try { m = (await r.json()).detail || m; } catch {}
      this._drawerError(m);
      return;
    }
    const row = await r.json();
    this.state.rows.push(row);
    this.state.rows.sort((a, b) => a.timecode_seconds - b.timecode_seconds);
    this._openIdx = this.state.rows.indexOf(row);
    this._syncTimecodes();
    this._renderEdit();
    await this._saveNow();
  },

  async _deleteFrame(i, btn) {
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1';
      btn.textContent = 'Click again to delete';
      setTimeout(() => { if (btn.isConnected) { btn.dataset.armed = ''; btn.textContent = 'Delete frame'; } }, 4000);
      return;
    }
    this.state.rows.splice(i, 1);
    this._openIdx = null;
    this._syncTimecodes();
    this._renderEdit();
    await this._saveNow();
  },

  _toggleChecked(i, btn) {
    const row = this.state.rows[i];
    row.status = row.status === 'CHECKED' ? 'PENDING' : 'CHECKED';
    btn.textContent = row.status === 'CHECKED' ? 'Mark as unchecked' : 'Mark as checked';
    document.querySelector(`.sheet-row[data-idx="${i}"] .status-dot`)?.classList.toggle('ok', row.status === 'CHECKED');
    this._updateSummary();
    this._saveNow();
  },

  _bindEditScreen() {
    const main = document.getElementById('edit-main');

    // Field edits: bound once here, so re-entering the screen never stacks handlers.
    main.addEventListener('input', e => {
      if (e.target.tagName !== 'TEXTAREA') return;
      const idx   = parseInt(e.target.closest('tr[data-idx]').dataset.idx, 10);
      const field = e.target.dataset.field;
      const val   = e.target.value;
      if (field === 'supers') this.state.rows[idx].supers = val.split('\n').map(s => s.trim()).filter(Boolean);
      else this.state.rows[idx][field] = val;
      this._autosizeAll();
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(() => this._saveNow(), 800);
    });

    main.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const tr  = el.closest('tr');
      const idx = tr.classList.contains('drawer-row') ? this._openIdx : parseInt(tr.dataset.idx, 10);
      switch (el.dataset.act) {
        case 'toggle': this._toggleDrawer(idx); break;
        case 'close':  this._toggleDrawer(idx); break;
        case 'play': {
          const v = document.getElementById('drawer-video');
          v.currentTime = this._segmentOf(idx).start; v.play();
          break;
        }
        case 'check':  this._toggleChecked(idx, el); break;
        case 'add':    this._addFrame(); break;
        case 'delete': this._deleteFrame(idx, el); break;
      }
    });

    new ResizeObserver(() => this._autosizeAll()).observe(main);

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this._openIdx !== null &&
          document.getElementById('screen-edit').classList.contains('active')) {
        this._toggleDrawer(this._openIdx);
      }
    });

    // Re-selecting frames re-runs the pipeline and discards every edit, so ask twice.
    const back = document.getElementById('btn-back-frames');
    back.onclick = () => {
      if (back.dataset.armed === '1') {
        back.dataset.armed = ''; back.classList.remove('armed'); back.textContent = '↩ Re-select frames';
        this.show('frames');
        return;
      }
      back.dataset.armed = '1'; back.classList.add('armed');
      back.textContent = 'This discards your edits. Click again';
      setTimeout(() => {
        back.dataset.armed = ''; back.classList.remove('armed'); back.textContent = '↩ Re-select frames';
      }, 4000);
    };
  },

  // ── Init ──────────────────────────────────────────────────────
  init() {
    this._initSelect();

    // Frame screen — bind all listeners once
    const video = document.getElementById('frames-video');

    video.addEventListener('loadedmetadata', () => {
      this._wvDur = video.duration;
      this._buildWaveform();
    });

    new ResizeObserver(() => { if (this._wvDur) this._buildWaveform(); })
      .observe(document.getElementById('waveform-bars'));

    document.getElementById('thumb-list').addEventListener('scroll', () => this._updateSidebarFade());
    new ResizeObserver(() => this._updateSidebarFade()).observe(document.getElementById('thumb-list'));

    video.addEventListener('timeupdate', () => {
      const t = video.currentTime;
      document.getElementById('video-tc-overlay').textContent = this.formatOverlayTC(t);
      this._updateWaveform(t);
      this._updateActionBtn(t);
      this._highlightThumb(t);
    });

    const setPlayIcon = playing => {
      document.getElementById('icon-play').style.display  = playing ? 'none' : '';
      document.getElementById('icon-pause').style.display = playing ? '' : 'none';
    };

    video.addEventListener('ended', () => setPlayIcon(false));

    document.getElementById('btn-play-main').onclick = () => {
      if (video.paused) { video.play(); setPlayIcon(true); }
      else              { video.pause(); setPlayIcon(false); }
    };

    document.getElementById('btn-step-back').onclick = () => { video.currentTime = Math.max(0, video.currentTime - 1); };
    document.getElementById('btn-step-fwd').onclick  = () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 1); };

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      const fps = this.state.metadata?.fps || 25;
      if (e.key === 'ArrowLeft')  { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 1 / fps); }
      if (e.key === 'ArrowRight') { e.preventDefault(); video.currentTime = Math.min(video.duration || 0, video.currentTime + 1 / fps); }
    });

    document.getElementById('vol-btn').onclick = () => {
      video.muted = !video.muted;
      document.getElementById('icon-vol-on').style.display  = video.muted ? 'none' : '';
      document.getElementById('icon-vol-off').style.display = video.muted ? '' : 'none';
    };

    // Waveform seek
    const ww = document.getElementById('waveform-wrap');
    let seeking = false;
    let _seekRaf = null;
    const seekTo = e => {
      const rect = ww.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * (this._wvDur || 0);
      // Update UI immediately — don't wait for timeupdate
      document.getElementById('video-tc-overlay').textContent = this.formatOverlayTC(t);
      this._updateWaveform(t);
      this._updateActionBtn(t);
      this._highlightThumb(t);
      // Throttle actual video seek to one per animation frame
      if (_seekRaf) cancelAnimationFrame(_seekRaf);
      _seekRaf = requestAnimationFrame(() => { video.currentTime = t; _seekRaf = null; });
    };
    ww.addEventListener('mousedown', e => { seeking = true; seekTo(e); });
    window.addEventListener('mousemove', e => { if (seeking) seekTo(e); });
    window.addEventListener('mouseup',  () => { seeking = false; });

    // Add/Remove frame
    document.getElementById('btn-add-remove').onclick = () => {
      const t   = parseFloat(video.currentTime.toFixed(3));
      const idx = this._findTCIdx(t);
      if (idx >= 0) {
        this.state.timecodes.splice(idx, 1);
      } else {
        this.state.timecodes.push({ time: t, thumb: this._captureFrame(video) });
        this.state.timecodes.sort((a,b) => a.time - b.time);
      }
      this._renderThumbList();
      this._updateWaveform(t);
      this._updateActionBtn(t);
      document.getElementById('btn-next').disabled = this.state.timecodes.length === 0;
    };

    document.getElementById('btn-next').onclick = () => this._startProcessing();
    document.getElementById('processing-cancel').onclick = () => this._cancelProcessing();
    new ResizeObserver(() => this._layoutStroke()).observe(document.getElementById('processing-card'));

    // Edit screen
    this._bindEditScreen();
    document.getElementById('btn-export-docx').onclick  = () => this.api.exportDocx(this.state.sessionId);
    document.getElementById('btn-export-pdf').onclick   = () => this.api.exportPdf(this.state.sessionId);

  },
};

App.init();
</script>
